spring:
  cloud:
    config:
      enabled: false
    vault:
      enabled: false
  liquibase:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  batch:
    jdbc:
      initialize-schema: always
  data:
    redis:
      autoconfigure:
        enabled: false
eureka:
  client:
    enabled: false